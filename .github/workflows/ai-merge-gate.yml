---
name: AI Merge Gate
on: pull_request
permissions: {}
jobs:
  gate:
    permissions:
      checks: read
      contents: read
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/_ai-merge-gate.yml@v2
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
      GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
